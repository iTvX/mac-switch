name: PR Check

on:
  pull_request:
    branches:
      - main
      - beta-pr40-modes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: Swift tests
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, mac-switch-local]
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Run Swift tests
        run: swift test

      - name: Validate release scripts
        run: bash -n Scripts/build_release.sh Scripts/check_release_ready.sh Scripts/generate_appcast.sh Scripts/publish_appcast.sh

  handoff-compatibility:
    name: Handoff compatibility (local macOS)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, mac-switch-local]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Show local Swift toolchain
        run: swift --version

      - name: Verify Handoff contract and behavior
        run: swift test --filter HandoffBehaviorTests

      - name: Verify Handoff localization
        run: swift test --filter LocalizationResourceTests
